//
// First, Physical strips
//

physical {
         pstrip LASER0 type LASER count 1 channel L0;
         pstrip LASER1 type LASER count 1 channel L1;
         pstrip LASER2 type LASER count 1 channel L2;
         pstrip LASER3 type LASER count 1 channel L3;
         pstrip LASER4 type LASER count 1 channel L4;
         pstrip LASER5 type LASER count 1 channel L5;
         pstrip LASER6 type LASER count 1 channel L6;
         pstrip LASER7 type LASER count 1 channel L7;
         pstrip LASER8 type LASER count 1 channel L8;
         pstrip LASER9 type LASER count 1 channel L9;

         pstrip STRIP0 channel S0 count 16;
         pstrip STRIP1 channel S1 count 16;
};

virtual {
        vstrip LASER0 { substrip LASER0; };
        vstrip LASER1 { substrip LASER1; };
        vstrip LASER2 { substrip LASER2; };
        vstrip LASER3 { substrip LASER3; };
        vstrip LASER4 { substrip LASER4; };
        vstrip LASER5 { substrip LASER5; };
        vstrip LASER6 { substrip LASER6; };
        vstrip LASER7 { substrip LASER7; };
        vstrip LASER8 { substrip LASER8; };
        vstrip LASER9 { substrip LASER9; };
        vstrip LSTRIP { substrip LASER0; substrip LASER1; substrip LASER2; substrip LASER3; substrip LASER4;
                        substrip LASER5; substrip LASER6; substrip LASER7; substrip LASER8; substrip LASER9; };
        vstrip STRIP0 { substrip STRIP0; };
        vstrip STRIP1 { substrip STRIP1; };
};

