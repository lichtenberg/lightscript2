//
// This is the LASER configuration file, which specifies the arrangement
// of LEDs on the project.
//
// This particular panel configuration file is for the PicoLaser
// configuration.
//


//
// First, Physical strips
//

physical {
         pstrip LASER0 type LASER count 1 channel L0;
         pstrip LASER1 type LASER count 1 channel L1;
         pstrip LASER2 type LASER count 1 channel L2;
         pstrip LASER3 type LASER count 1 channel L3;
         pstrip LASER4 type LASER count 1 channel L4;
         pstrip LASER5 type LASER count 1 channel L5;
         pstrip LASER6 type LASER count 1 channel L6;
         pstrip LASER7 type LASER count 1 channel L7;
         pstrip LASER8 type LASER count 1 channel L8;
         pstrip LASER9 type LASER count 1 channel L9;

         pstrip STRIP0 channel S0 count 166;
         pstrip STRIP1 channel S1 count 96;
};

virtual {
        vstrip LASER0 { substrip LASER0; };
        vstrip LASER1 { substrip LASER1; };
        vstrip LASER2 { substrip LASER2; };
        vstrip LASER3 { substrip LASER3; };
        vstrip LASER4 { substrip LASER4; };
        vstrip LASER5 { substrip LASER5; };
        vstrip LASER6 { substrip LASER6; };
        vstrip LASER7 { substrip LASER7; };
        vstrip LASER8 { substrip LASER8; };
        vstrip LASER9 { substrip LASER9; };
        vstrip LSTRIP { substrip LASER0; substrip LASER1; substrip LASER2; substrip LASER3; substrip LASER4;
                        substrip LASER5; substrip LASER6; substrip LASER7; substrip LASER8; substrip LASER9; };
        vstrip RINGLET1 { substrip STRIP1 start 0  count 16; };
        vstrip RINGLET2 { substrip STRIP1 start 16 count 16; };
        vstrip RINGLET3 { substrip STRIP1 start 32 count 16; };
        vstrip RINGLET4 { substrip STRIP1 start 48 count 16; };
        vstrip RINGLET5 { substrip STRIP1 start 56 count 16; };
        vstrip RINGLET6 { substrip STRIP1 start 64 count 16; };
        vstrip ALLRINGS { substrip STRIP1 start 0 count 96; };
        vstrip PERIMETER { substrip STRIP0; };

        vstrip BOTTOM { substrip STRIP0 start 0  count 73; };
        vstrip RIGHT  { substrip STRIP0 start 73 count 10; };
        vstrip TOP    { substrip STRIP0 start 83 count 73; };
        vstrip LEFT   { substrip STRIP0 start 156 count 10; };

        vstrip LLCORNER   { substrip STRIP0 start 164 count 2;
                            substrip STRIP0 start 0 count 2; };
        vstrip LRCORNER   { substrip STRIP0 start 71 count 4; };
        vstrip URCORNER   { substrip STRIP0 start 81 count 4; };
        vstrip ULCORNER   { substrip STRIP0 start 154 count 4; };
};

